name: Build Jarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download Whisper model
        run: python -c "import faster_whisper; faster_whisper.download_model('small')"

      - name: Locate CUDA DLL directories
        run: |
          $cublas = python -c "import importlib.util; spec=importlib.util.find_spec('nvidia.cublas'); print(spec.submodule_search_locations[0] + '\\lib')"
          $cudnn = python -c "import importlib.util; spec=importlib.util.find_spec('nvidia.cudnn'); print(spec.submodule_search_locations[0] + '\\lib')"
          echo "CUBLAS_DIR=$cublas" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDNN_DIR=$cudnn" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --icon jarvis.ico --collect-all nvidia.cublas --collect-all nvidia.cudnn --hidden-import keyboard --add-data "$env:CUBLAS_DIR\*.dll;nvidia\cublas\lib" --add-data "$env:CUDNN_DIR\*.dll;nvidia\cudnn\lib" --name Jarvis src/tray.py

      - name: Create distribution package
        run: |
          mkdir jarvis-pkg
          copy dist\Jarvis.exe jarvis-pkg\
          copy .env.example jarvis-pkg\
          copy README.md jarvis-pkg\
          powershell Compress-Archive -Path jarvis-pkg\* -DestinationPath Jarvis-Release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Release-Package
          path: Jarvis-Release.zip
