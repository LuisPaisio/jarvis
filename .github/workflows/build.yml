name: Build Jarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download Whisper model
        run: python -c "import faster_whisper; faster_whisper.download_model('small')"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $resources = python -c "import openwakeword, os; print(os.path.join(os.path.dirname(openwakeword.__file__), 'resources'))"
          pyinstaller --onefile --windowed --icon jarvis.ico --collect-all nvidia.cublas --collect-all nvidia.cudnn --add-data "models/hey_jarvis_v0.1.onnx;./models/" --add-data "$resources;./openwakeword/resources/" --name Jarvis src/tray.py

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: dist/Jarvis.exe
