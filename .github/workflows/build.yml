name: Build Jarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Download Whisper model
        run: python -c "import faster_whisper; faster_whisper.download_model('medium')"

      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --icon jarvis.ico --collect-all nvidia.cublas --collect-all nvidia.cudnn --hidden-import keyboard --name Jarvis src/tray.py

      - name: Create distribution package
        run: |
          mkdir jarvis-pkg
          copy dist\Jarvis.exe jarvis-pkg\
          copy .env.example jarvis-pkg\
          copy README.md jarvis-pkg\
          powershell Compress-Archive -Path jarvis-pkg\* -DestinationPath Jarvis-Release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Release-Package
          path: Jarvis-Release.zip
